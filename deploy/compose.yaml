# Privatum self-hosted instance: relay + Tor onion service.
#   cd deploy && docker compose up -d
#   docker compose exec tor cat /run/onion/hostname   # your .onion address (also in the tor/relay logs)
# The app is reachable only through the onion address. The "admin" service publishes a
# local-only management panel (127.0.0.1) with that address; Docker Desktop lists it as a link.

name: privatum

services:
  relay:
    build:
      context: ..
      dockerfile: deploy/relay.Dockerfile
    image: privatum-relay:local
    restart: unless-stopped
    # tor must create the shared volume first so it keeps tor's ownership.
    depends_on: [tor]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      PRIVATUM_HOST_FILE: /run/onion/hostname
      PRIVATUM_DB: /data/relay.sqlite
      PRIVATUM_MESSAGE_TTL_DAYS: "14"
      PRIVATUM_MAX_MAILBOXES: "10000"
      # Internal API for the panel (port 8081). The onion service forwards only to 8080.
      PRIVATUM_ADMIN_TOKEN_FILE: /run/admin-token/token
    volumes:
      - relay-data:/data
      - onion-hostname:/run/onion:ro
      - admin-token:/run/admin-token:ro
    networks:
      internal:
        ipv4_address: 172.30.0.10

  tor:
    build:
      context: .
      dockerfile: tor.Dockerfile
    image: privatum-tor:local
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    volumes:
      - tor-state:/var/lib/tor
      - onion-hostname:/run/onion
    networks:
      - internal
      - egress

  admin:
    # Local-only management panel. It is not the app and is never reachable through the .onion.
    image: privatum-relay:local
    entrypoint: ["/usr/local/bin/privatum-admin"]
    restart: unless-stopped
    depends_on: [relay]
    read_only: true
    # tor's user: the panel manages the onion key and talks to tor's control socket.
    user: "100:101"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      PRIVATUM_TOR_DIR: /tor
      PRIVATUM_RELAY_ADMIN: 172.30.0.10:8081
      PRIVATUM_ADMIN_TOKEN_FILE: /run/admin-token/token
      PRIVATUM_INFO_PORT: ${PRIVATUM_INFO_PORT:-8099}
    volumes:
      - tor-state:/tor
      - admin-data:/admin
      - admin-token:/run/admin-token
    ports:
      # Loopback only (IPv4 and IPv6): never reachable from the network. Safari opens
      # "localhost" over IPv6 first, so the Docker Desktop link needs both.
      - "127.0.0.1:${PRIVATUM_INFO_PORT:-8099}:8080"
      - "[::1]:${PRIVATUM_INFO_PORT:-8099}:8080"
    networks:
      - internal
      - admin

networks:
  # The relay has no route to the internet; only tor can reach it.
  internal:
    internal: true
    ipam:
      config:
        - subnet: 172.30.0.0/24
  egress: {}
  # Publishes the panel's port; the internal network cannot publish ports.
  admin: {}

volumes:
  relay-data:
  # Contains the onion service private key. See docs/OPERATIONS.md for backup.
  tor-state:
  onion-hostname:
  # Panel password hash, and the token the relay checks for the panel's internal calls.
  admin-data:
  admin-token:
