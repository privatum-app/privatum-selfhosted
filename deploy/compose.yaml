# Privatum self-hosted instance: relay + Tor onion service.
#   cd deploy && docker compose up -d
#   docker compose exec tor cat /run/onion/hostname   # your .onion address (also in the tor/relay logs)
# The app is reachable only through the onion address. The "info" service publishes a
# local-only page (127.0.0.1) that shows that address; Docker Desktop lists it as a link.

name: privatum

services:
  relay:
    build:
      context: ..
      dockerfile: deploy/relay.Dockerfile
    image: privatum-relay:local
    restart: unless-stopped
    # tor must create the shared volume first so it keeps tor's ownership.
    depends_on: [tor]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      PRIVATUM_HOST_FILE: /run/onion/hostname
      PRIVATUM_DB: /data/relay.sqlite
      PRIVATUM_MESSAGE_TTL_DAYS: "14"
      PRIVATUM_MAX_MAILBOXES: "10000"
    volumes:
      - relay-data:/data
      - onion-hostname:/run/onion:ro
    networks:
      internal:
        ipv4_address: 172.30.0.10

  tor:
    build:
      context: .
      dockerfile: tor.Dockerfile
    image: privatum-tor:local
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    volumes:
      - tor-state:/var/lib/tor
      - onion-hostname:/run/onion
    networks:
      - internal
      - egress

  info:
    # Local-only page with the .onion address and how to open it. It is not the app.
    image: busybox:1.37-musl@sha256:5cec3fc171c87218698e85a52af7087de727372aae264a787b8112901a5b0092
    restart: unless-stopped
    depends_on: [tor]
    read_only: true
    user: "65534:65534"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    command: ["/bin/sh", "/info/info.sh"]
    volumes:
      - ./info:/info:ro
      - onion-hostname:/run/onion:ro
    ports:
      # Bound to 127.0.0.1 only: never reachable from the network.
      - "127.0.0.1:${PRIVATUM_INFO_PORT:-8099}:8080"
    networks:
      - info

networks:
  # The relay has no route to the internet; only tor can reach it.
  internal:
    internal: true
    ipam:
      config:
        - subnet: 172.30.0.0/24
  egress: {}
  # Separate network for the info page, so it shares nothing with the relay.
  info: {}

volumes:
  relay-data:
  # Contains the onion service private key. See docs/OPERATIONS.md for backup.
  tor-state:
  onion-hostname:
