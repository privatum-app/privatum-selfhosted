name: release

# Builds the instance images for amd64 and arm64, pushes them to ghcr.io, signs
# them with cosign (keyless, via GitHub OIDC), attaches SBOM and provenance, and
# publishes the end-user bundle (compose.yaml pinned by digest + shortcuts).
# Run by pushing a tag like v0.1.0. Actions are pinned by commit SHA.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub Release
  packages: write # push to ghcr.io
  id-token: write # keyless cosign signatures

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      REGISTRY: ghcr.io/${{ github.repository_owner }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Build and push relay (WASM + client + relay)
        id: relay
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/relay.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/privatum-relay:${{ env.TAG }}
          sbom: true
          provenance: mode=max

      - name: Build and push tor
        id: tor
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy
          file: deploy/tor.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/privatum-tor:${{ env.TAG }}
          sbom: true
          provenance: mode=max

      - name: Sign images
        env:
          RELAY: ${{ env.REGISTRY }}/privatum-relay@${{ steps.relay.outputs.digest }}
          TOR: ${{ env.REGISTRY }}/privatum-tor@${{ steps.tor.outputs.digest }}
        run: |
          cosign sign --yes "$RELAY"
          cosign sign --yes "$TOR"

      - name: Bundle
        env:
          RELAY: ${{ env.REGISTRY }}/privatum-relay:${{ env.TAG }}@${{ steps.relay.outputs.digest }}
          TOR: ${{ env.REGISTRY }}/privatum-tor:${{ env.TAG }}@${{ steps.tor.outputs.digest }}
        run: |
          sh deploy/release/make-bundle.sh "$RELAY" "$TOR" "privatum-$TAG"
          zip -r "privatum-$TAG.zip" "privatum-$TAG"

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" "privatum-$TAG.zip" --latest --title "Privatum $TAG" --notes "Sem auditoria externa. Baixe privatum-$TAG.zip, extraia e dê dois cliques em iniciar (veja LEIA-ME.txt). Imagens assinadas com cosign; verificação em docs/OPERATIONS.md."
