[package]
name = "privatum-relay"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[dependencies]
axum = { version = "0.8", features = ["ws"] }
data-encoding = "2"
ed25519-dalek = "2"
rand = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
tower-http = { version = "0.6", features = ["fs", "set-header"] }

[dev-dependencies]
futures-util = "0.3"
http-body-util = "0.1"
tokio-tungstenite = "0.26"
tower = { version = "0.5", features = ["util"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
