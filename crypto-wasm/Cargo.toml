[package]
name = "privatum-crypto"
version = "0.2.1"
edition = "2021"
license = "AGPL-3.0-only"
publish = false
description = "Thin wasm-bindgen glue over vodozemac (Olm). No cryptography is implemented here."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
data-encoding = "2"
serde_json = "1"
# Pinned exactly: this is the audited protocol implementation; bump deliberately.
vodozemac = { version = "=0.11.1", default-features = false, features = ["precomputed-tables"] }
wasm-bindgen = "=0.2.129"

[target.'cfg(target_arch = "wasm32")'.dependencies]
vodozemac = { version = "=0.11.1", default-features = false, features = ["precomputed-tables", "wasm_js"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
